# Builds an unsigned iOS .ipa on a GitHub macOS runner, for sideloading with a free Apple ID
# (e.g. Sideloadly). Run it manually from the Actions tab and download the artifact.
name: iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deprecation warnings come from Expo/Jest tooling and can't be fixed here; show real errors only.
      - run: npm ci --loglevel=error

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build without code signing
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ViMinh-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ViMinh-unsigned-ipa
          path: ViMinh-unsigned.ipa
          retention-days: 14
