<!-- Interactive JavaScript logic for Numpad & Visual Switching -->
<script>
    let rawAmount = "150000";
    let transactionType = "expense";

    function updateDisplay() {
      const displayEl = document.getElementById("display-amount");
      if (!rawAmount || rawAmount === "0") {
        displayEl.innerText = "0";
      } else {
        const num = parseInt(rawAmount, 10);
        displayEl.innerText = isNaN(num) ? "0" : num.toLocaleString("vi-VN");
      }
    }

    function pressDigit(val) {
      if (rawAmount === "0" && val !== ".") {
        rawAmount = val;
      } else {
        if (rawAmount.length < 11) {
          rawAmount += val;
        }
      }
      updateDisplay();
    }

    function backspace() {
      if (rawAmount.length > 0) {
        rawAmount = rawAmount.slice(0, -1);
      }
      if (rawAmount === "") {
        rawAmount = "0";
      }
      updateDisplay();
    }

    function clearAmount() {
      rawAmount = "0";
      updateDisplay();
    }

    function quickAdd(val) {
      let current = parseInt(rawAmount, 10) || 0;
      current += val;
      rawAmount = current.toString();
      updateDisplay();
    }

    function switchType(type) {
      transactionType = type;
      const tabExp = document.getElementById("tab-expense");
      const tabInc = document.getElementById("tab-income");
      const tabTrans = document.getElementById("tab-transfer");
      const signEl = document.getElementById("amount-sign");

      [tabExp, tabInc, tabTrans].forEach(btn => {
        btn.className = "flex-1 py-1.5 rounded-lg text-label-md font-label-md text-on-surface-variant hover:text-on-surface transition-all flex items-center justify-center gap-space-xs";
        btn.innerHTML = btn.innerText;
      });

      if (type === 'expense') {
        tabExp.className = "flex-1 py-1.5 rounded-lg text-label-md font-label-md bg-surface-card-light text-expense-red font-semibold shadow-sm transition-all flex items-center justify-center gap-space-xs";
        tabExp.innerHTML = `<span class="w-2 h-2 rounded-full bg-expense-red"></span> Chi tiền`;
        signEl.innerText = "-";
        signEl.className = "text-expense-red text-currency-display font-currency-display font-bold";
      } else if (type === 'income') {
        tabInc.className = "flex-1 py-1.5 rounded-lg text-label-md font-label-md bg-surface-card-light text-primary font-semibold shadow-sm transition-all flex items-center justify-center gap-space-xs";
        tabInc.innerHTML = `<span class="w-2 h-2 rounded-full bg-primary"></span> Thu tiền`;
        signEl.innerText = "+";
        signEl.className = "text-primary text-currency-display font-currency-display font-bold";
      } else {
        tabTrans.className = "flex-1 py-1.5 rounded-lg text-label-md font-label-md bg-surface-card-light text-secondary font-semibold shadow-sm transition-all flex items-center justify-center gap-space-xs";
        tabTrans.innerHTML = `<span class="w-2 h-2 rounded-full bg-secondary"></span> Chuyển khoản`;
        signEl.innerText = "";
      }
    }

    function selectCategory(buttonElement, catName) {
      // Remove badge and selected styles from all category buttons
      const container = buttonElement.parentElement;
      const allButtons = container.querySelectorAll('button');
      
      allButtons.forEach(btn => {
        btn.className = "flex flex-col items-center p-2 rounded-xl hover:bg-surface-elevated-light border-2 border-transparent group transition-all";
        const badge = btn.querySelector('.absolute');
        if (badge) badge.remove();
        const label = btn.querySelector('span.text-label-sm');
        if (label) {
          label.classList.remove('text-on-surface', 'font-semibold');
          label.classList.add('text-on-surface-variant');
        }
      });

      // Apply selected style to chosen category
      buttonElement.className = "relative flex flex-col items-center p-2 rounded-xl bg-orange-50 border-2 border-orange-400 group transition-all";
      const label = buttonElement.querySelector('span.text-label-sm');
      if (label) {
        label.classList.add('text-on-surface', 'font-semibold');
        label.classList.remove('text-on-surface-variant');
      }

      // Append check badge
      const badge = document.createElement('span');
      badge.className = "absolute -top-1 -right-1 w-4 h-4 bg-primary text-on-primary rounded-full flex items-center justify-center text-[10px] ring-2 ring-white";
      badge.innerHTML = `<span class="material-symbols-outlined text-[12px]" data-icon="check">check</span>`;
      buttonElement.appendChild(badge);
    }

    function completeEntry() {
      const btn = document.getElementById("save-btn");
      btn.classList.add('scale-110', 'text-primary-container');
      setTimeout(() => {
        btn.classList.remove('scale-110', 'text-primary-container');
        alert("Đã lưu giao dịch thành công!");
      }, 150);
    }
  </script>
</body></html>
